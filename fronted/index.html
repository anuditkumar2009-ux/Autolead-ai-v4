<script>
"use strict";

const API = "https://autolead-ai-v4.onrender.com";

let leads = [];
let signupMode = false;
let toastTimer = null;

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message,error=false){
  const el=$("toast");
  if(!el)return;
  el.textContent=message;
  el.className=error?"toast-show toast-error":"toast-show";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.className="",3200);
}

function setLoading(btn,loading,text){
  if(!btn)return;

  if(loading){
    btn.disabled=true;
    btn.dataset.oldText=btn.innerHTML;
    btn.innerHTML='<span class="spinner"></span>'+esc(text||"Please wait…");
  }else{
    btn.disabled=false;
    btn.innerHTML=btn.dataset.oldText||text||"Continue";
    delete btn.dataset.oldText;
  }
}

async function api(path,options={}){
  const headers={
    ...(options.headers||{})
  };

  if(options.body && !(options.body instanceof FormData)){
    headers["Content-Type"]="application/json";
  }

  const token=localStorage.getItem("autolead_token");
  if(token) headers.Authorization="Bearer "+token;

  let response;

  try{
    response=await fetch(API+path,{
      ...options,
      headers
    });
  }catch(e){
    throw new Error("Backend se connection nahi ho pa raha.");
  }

  const data=await response.json().catch(()=>({}));

  if(!response.ok){
    throw new Error(
      data.error ||
      data.message ||
      "Request failed ("+response.status+")"
    );
  }

  return data;
}

/* ---------- AUTH ---------- */

function showAuth(){
  $("authView")?.classList.remove("hidden");
  $("resetView")?.classList.add("hidden");
  $("appView")?.classList.add("hidden");
}

function showReset(){
  $("authView")?.classList.add("hidden");
  $("resetView")?.classList.remove("hidden");
  $("appView")?.classList.add("hidden");
}

function showApp(){
  $("authView")?.classList.add("hidden");
  $("resetView")?.classList.add("hidden");
  $("appView")?.classList.remove("hidden");

  const user=JSON.parse(localStorage.getItem("autolead_user")||"{}");

  if($("userChip")){
    $("userChip").textContent=user.name||user.email||"Workspace";
  }

  refresh();
  health();
}

function setAuthMode(signup){
  signupMode=signup;

  $("signupNameWrap")?.classList.toggle("hidden",!signup);

  if($("authTitle")){
    $("authTitle").textContent=signup
      ?"Create your workspace"
      :"Welcome back";
  }

  if($("authDesc")){
    $("authDesc").textContent=signup
      ?"Start your real-estate sales intelligence workspace."
      :"Sign in to your AutoLead AI workspace.";
  }

  if($("authBtn")){
    $("authBtn").textContent=signup?"Create account":"Sign in";
  }

  if($("switchBtn")){
    $("switchBtn").textContent=signup
      ?"Already have an account? Sign in"
      :"Create an account";
  }

  $("forgotRow")?.classList.toggle("hidden",signup);

  $("authMsg").textContent="";
}

async function submitAuth(){
  const btn=$("authBtn");
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;

  if(signupMode){
    const name=$("authName").value.trim();

    if(name.length<2){
      $("authMsg").textContent="Please enter your full name.";
      return;
    }

    if(password.length<8){
      $("authMsg").textContent="Password must be at least 8 characters.";
      return;
    }

    setLoading(btn,true,"Creating account…");

    try{
      const data=await api("/api/auth/signup",{
        method:"POST",
        body:JSON.stringify({name,email,password})
      });

      if(data.token){
        localStorage.setItem("autolead_token",data.token);
        localStorage.setItem(
          "autolead_user",
          JSON.stringify(data.user||{name,email})
        );
        toast("Account created successfully.");
        showApp();
      }else{
        setAuthMode(false);
        $("authEmail").value=email;
        $("authMsg").textContent="Account created. Please sign in.";
        toast("Account created.");
      }

    }catch(e){
      $("authMsg").textContent=e.message;
      toast(e.message,true);
    }finally{
      setLoading(btn,false);
    }

    return;
  }

  if(!email || !email.includes("@")){
    $("authMsg").textContent="Please enter a valid email.";
    return;
  }

  if(!password){
    $("authMsg").textContent="Please enter your password.";
    return;
  }

  setLoading(btn,true,"Signing in…");

  try{
    const data=await api("/api/auth/login",{
      method:"POST",
      body:JSON.stringify({email,password})
    });

    if(!data.token){
      throw new Error("Login response mein token nahi mila.");
    }

    localStorage.setItem("autolead_token",data.token);
    localStorage.setItem(
      "autolead_user",
      JSON.stringify(data.user||{email})
    );

    $("authMsg").textContent="";
    toast("Signed in successfully.");
    showApp();

  }catch(e){
    $("authMsg").textContent=e.message;
    toast(e.message,true);
  }finally{
    setLoading(btn,false);
  }
}

async function forgotPassword(){
  const btn=$("forgotBtn");
  const email=$("authEmail").value.trim();

  if(!email || !email.includes("@")){
    $("authMsg").textContent="Enter your email first.";
    return;
  }

  setLoading(btn,true,"Sending…");

  try{
    await api("/api/auth/forgot-password",{
      method:"POST",
      body:JSON.stringify({email})
    });

    $("authMsg").textContent=
      "If this email exists, a password-reset link has been sent.";
    toast("Reset request sent.");

  }catch(e){
    $("authMsg").textContent=e.message;
    toast(e.message,true);
  }finally{
    setLoading(btn,false,"Forgot password?");
  }
}

async function resetPassword(){
  const btn=$("resetBtn");
  const p1=$("resetPassword").value;
  const p2=$("resetPassword2").value;

  if(p1.length<8){
    $("resetMsg").textContent="Password must be at least 8 characters.";
    return;
  }

  if(p1!==p2){
    $("resetMsg").textContent="Passwords do not match.";
    return;
  }

  const params=new URLSearchParams(location.search);
  const token=params.get("reset_token")||params.get("token");

  if(!token){
    $("resetMsg").textContent="Reset token missing or expired.";
    return;
  }

  setLoading(btn,true,"Updating…");

  try{
    await api("/api/auth/reset-password",{
      method:"POST",
      body:JSON.stringify({
        token,
        password:p1
      })
    });

    toast("Password updated successfully.");

    history.replaceState({},document.title,location.pathname);

    showAuth();
    setAuthMode(false);

    $("authMsg").textContent="Password updated. Please sign in.";

  }catch(e){
    $("resetMsg").textContent=e.message;
    toast(e.message,true);
  }finally{
    setLoading(btn,false,"Update password");
  }
}

/* ---------- HEALTH ---------- */

async function health(){
  const badge=$("healthBadge");

  if(!badge)return;

  try{
    const d=await api("/api/health");

    badge.innerHTML=
      '<span class="dot"></span><span>'+
      (d.ai
        ?"Backend + DB + Gemini"
        :"Backend + DB")+
      "</span>";

  }catch(e){
    badge.innerHTML=
      '<span class="dot" style="background:#ff6b81"></span>'+
      '<span>Backend disconnected</span>';
  }
}

/* ---------- TRIAL ---------- */

async function loadTrial(){
  try{
    const d=await api("/api/trial");

    if($("trialPill")){
      $("trialPill").textContent=
        `Trial: ${d.active?"Active":"Expired"} • `+
        `${d.daysLeft??0} day(s) left • `+
        `${d.leadsRemaining??0} lead(s) remaining`;
    }

  }catch(e){
    if($("trialPill")){
      $("trialPill").textContent="Trial: unavailable";
    }
  }
}

/* ---------- LEADS ---------- */

async function loadLeads(){
  const box=$("leadsBox");

  try{
    const data=await api("/api/leads");

    leads=Array.isArray(data)
      ?data
      :(data.leads||[]);

    renderLeads();
    updateStats();

  }catch(e){
    leads=[];

    if(box){
      box.innerHTML=
        '<div class="empty">'+
        esc(e.message)+
        "</div>";
    }

    updateStats();
  }
}

function temperature(lead){
  const value=
    String(
      lead.temperature||
      lead.ai_temperature||
      lead.priority||
      ""
    ).toLowerCase();

  if(value.includes("hot"))return"hot";
  if(value.includes("warm"))return"warm";
  if(value.includes("cold"))return"cold";

  const score=Number(
    lead.ai_score||
    lead.score||
    0
  );

  if(score>=80)return"hot";
  if(score>=60)return"warm";
  if(score>0)return"cold";

  return"none";
}

function getName(lead){
  return lead.name||
    lead.full_name||
    lead.customer_name||
    "Unnamed lead";
}

function getPhone(lead){
  return lead.phone||
    lead.mobile||
    lead.phone_number||
    "";
}

function getEmail(lead){
  return lead.email||"";
}

function getCity(lead){
  return lead.city||
    lead.location||
    "";
}

function getProperty(lead){
  return lead.property||
    lead.property_name||
    lead.project||
    lead.project_name||
    "";
}

function getStatus(lead){
  return lead.status||"New";
}

function getScore(lead){
  return Number(
    lead.ai_score||
    lead.score||
    0
  );
}

function renderLeads(){
  const box=$("leadsBox");
  if(!box)return;

  const q=($("searchBox")?.value||"")
    .trim()
    .toLowerCase();

  const filter=$("filterStatus")?.value||"All";

  const filtered=leads.filter(lead=>{
    const status=getStatus(lead);

    if(filter!=="All" && status!==filter){
      return false;
    }

    if(!q)return true;

    return [
      getName(lead),
      getEmail(lead),
      getPhone(lead),
      getCity(lead),
      getProperty(lead),
      status
    ].join(" ").toLowerCase().includes(q);
  });

  if(!filtered.length){
    box.innerHTML=
      '<div class="empty">'+
      (leads.length
        ?"No leads match your search."
        :"No authorized leads yet. Import your real lead CSV to begin.")+
      "</div>";
    return;
  }

  box.innerHTML=filtered.map(lead=>{
    const temp=temperature(lead);
    const score=getScore(lead);

    const meta=[
      getCity(lead),
      getProperty(lead)
    ].filter(Boolean).join(" • ");

    const phone=getPhone(lead);

    return `
      <article class="lead">
        <div class="lead-top">
          <div>
            <div class="lead-name">${esc(getName(lead))}</div>
            <div class="lead-meta">${esc(meta||getEmail(lead)||"Lead")}</div>
          </div>

          <span class="temp ${temp}">
            ${temp==="hot"?"🔥":temp==="warm"?"◐":temp==="cold"?"❄":"•"}
            ${temp==="none"?"Unscored":temp.toUpperCase()}
          </span>
        </div>

        <div class="lead-mid">
          ${
            score
            ?`<span class="mini">AI score <b class="score">${score}</b></span>`
            :""
          }

          ${
            getEmail(lead)
            ?`<span class="mini">${esc(getEmail(lead))}</span>`
            :""
          }

          ${
            phone
            ?`<span class="mini">${esc(phone)}</span>`
            :""
          }

          <span class="mini">${esc(getStatus(lead))}</span>
        </div>

        <div class="lead-actions">

          ${
            phone
            ?`<button class="btn btn-wa"
                type="button"
                onclick="autoWhatsApp('${encodeURIComponent(phone)}')">
                WhatsApp
              </button>`
            :""
          }

          ${
            phone
            ?`<button class="btn btn-call"
                type="button"
                onclick="autoCall('${encodeURIComponent(phone)}')">
                Call
              </button>`
            :""
          }

          <button class="btn btn-ai"
            type="button"
            onclick="autoAnalyze(${Number(lead.id)||0})">
            ✦ AI qualify
          </button>

          <select
            class="status-select"
            onchange="autoStatus(${Number(lead.id)||0},this.value)"
          >
            ${[
              "New",
              "Qualified",
              "Contacted",
              "Interested",
              "Site Visit",
              "Negotiation",
              "Booked",
              "Converted"
            ].map(s=>
              `<option ${getStatus(lead)===s?"selected":""}>${s}</option>`
            ).join("")}
          </select>

        </div>
      </article>
    `;
  }).join("");
}

async function updateLeadStatus(id,status){
  if(!id)return;

  try{
    await api("/api/leads/"+id+"/status",{
      method:"PATCH",
      body:JSON.stringify({status})
    });

    const lead=leads.find(x=>Number(x.id)===Number(id));

    if(lead)lead.status=status;

    renderLeads();
    updateStats();
    toast("Lead status updated.");

  }catch(e){
    toast(e.message,true);
    renderLeads();
  }
}

async function analyzeLead(id){
  if(!id)return;

  const modal=$("aiModal");

  if(modal){
    modal.classList.add("show");
    modal.style.display="flex";

    const text=$("aiText");
    if(text){
      text.innerHTML=
        '<span class="spinner"></span>AI is analyzing this lead…';
    }
  }

  try{
    const d=await api("/api/ai/analyze",{
      method:"POST",
      body:JSON.stringify({
        leadId:Number(id)
      })
    });

    const result=
      d.analysis||
      d.result||
      d.message||
      JSON.stringify(d,null,2);

    if($("aiText")){
      $("aiText").textContent=result;
    }

    const lead=leads.find(x=>Number(x.id)===Number(id));

    if(lead && d.score!=null){
      lead.ai_score=d.score;
    }

    renderLeads();

  }catch(e){
    if($("aiText"))$("aiText").textContent=e.message;
    toast(e.message,true);
  }
}

/* ---------- ACTIONS ---------- */

window.autoWhatsApp=function(encodedPhone){
  const phone=decodeURIComponent(encodedPhone||"").replace(/\D/g,"");

  if(!phone){
    toast("No phone number available.",true);
    return;
  }

  window.open(
    "https://wa.me/"+phone,
    "_blank",
    "noopener"
  );
};

window.autoCall=function(encodedPhone){
  const phone=decodeURIComponent(encodedPhone||"");

  if(!phone){
    toast("No phone number available.",true);
    return;
  }

  location.href="tel:"+phone;
};

window.autoStatus=function(id,status){
  updateLeadStatus(id,status);
};

window.autoAnalyze=function(id){
  analyzeLead(id);
};

/* ---------- STATS ---------- */

function updateStats(){
  const total=leads.length;

  const hot=leads.filter(
    x=>temperature(x)==="hot"
  ).length;

  const visits=leads.filter(
    x=>String(getStatus(x)).toLowerCase()==="site visit"
  ).length;

  let value=0;

  leads.forEach(x=>{
    const n=Number(
      x.budget||
      x.property_value||
      x.value||
      0
    );

    if(Number.isFinite(n))value+=n;
  });

  if($("totalStat"))$("totalStat").textContent=total;
  if($("hotStat"))$("hotStat").textContent=hot;
  if($("visitStat"))$("visitStat").textContent=visits;

  if($("valueStat")){
    $("valueStat").textContent=
      "₹"+Math.round(value).toLocaleString("en-IN");
  }

  updatePipeline();
}

function updatePipeline(){
  const counts={};

  leads.forEach(l=>{
    const s=getStatus(l);
    counts[s]=(counts[s]||0)+1;
  });

  document.querySelectorAll(".pipe").forEach(pipe=>{
    const span=pipe.querySelector("span");
    const b=pipe.querySelector("b");

    if(!span||!b)return;

    const label=span.textContent.trim();

    const map={
      "NEW":"New",
      "QUALIFIED":"Qualified",
      "CONTACTED":"Contacted",
      "INTERESTED":"Interested",
      "SITE VISIT":"Site Visit",
      "NEGOTIATION":"Negotiation",
      "BOOKED":"Booked",
      "CONVERTED":"Converted"
    };

    const key=map[label]||label;

    b.textContent=counts[key]||0;
  });
}

/* ---------- CSV IMPORT ---------- */

function openFilePicker(){
  $("csvInput")?.click();
}

async function importCsv(file){
  if(!file)return;

  const btn=$("uploadBtn");

  setLoading(btn,true,"Importing…");

  try{
    const form=new FormData();
    form.append("file",file);

    const data=await api("/api/leads/import",{
      method:"POST",
      body:form
    });

    toast(
      `${data.imported??data.count??0} lead(s) imported successfully.`
    );

    await refresh();

  }catch(e){
    toast(e.message,true);
  }finally{
    setLoading(btn,false,"Upload CSV");
  }
}

/* ---------- REFRESH ---------- */

async function refresh(){
  await Promise.all([
    loadTrial(),
    loadLeads()
  ]);
}

/* ---------- MODAL ---------- */

function closeAi(){
  const modal=$("aiModal");

  if(modal){
    modal.classList.remove("show");
    modal.style.display="none";
  }
}

/* ---------- EVENTS ---------- */

document.addEventListener("DOMContentLoaded",()=>{

  $("authBtn")?.addEventListener(
    "click",
    submitAuth
  );

  $("switchBtn")?.addEventListener(
    "click",
    ()=>{
      setAuthMode(!signupMode);
    }
  );

  $("forgotBtn")?.addEventListener(
    "click",
    forgotPassword
  );

  $("resetBtn")?.addEventListener(
    "click",
    resetPassword
  );

  $("logoutBtn")?.addEventListener(
    "click",
    ()=>{
      localStorage.removeItem("autolead_token");
      localStorage.removeItem("autolead_user");

      leads=[];
      showAuth();
      setAuthMode(false);

      $("authEmail").value="";
      $("authPassword").value="";
      $("authMsg").textContent="";

      toast("Logged out.");
    }
  );

  $("searchBox")?.addEventListener(
    "input",
    renderLeads
  );

  $("filterStatus")?.addEventListener(
    "change",
    renderLeads
  );

  $("csvInput")?.addEventListener(
    "change",
    e=>{
      const file=e.target.files?.[0];
      if(file)importCsv(file);
      e.target.value="";
    }
  );

  $("uploadBtn")?.addEventListener(
    "click",
    openFilePicker
  );

  document.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;

    if(!$("resetView")?.classList.contains("hidden")){
      resetPassword();
      return;
    }

    if(!$("authView")?.classList.contains("hidden")){
      submitAuth();
    }
  });

  $("aiModal")?.addEventListener(
    "click",
    e=>{
      if(e.target===$("aiModal"))closeAi();
    }
  );

  /* reset link */
  const params=new URLSearchParams(location.search);

  if(params.get("reset_token")||params.get("token")){
    showReset();
  }else if(localStorage.getItem("autolead_token")){
    showApp();
  }else{
    showAuth();
    setAuthMode(false);
  }

  health();
});

window.refresh=refresh;
window.closeAi=closeAi;
</script>
